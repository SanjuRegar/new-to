<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanju Regar - NEW TO</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        /* ऊपर आपकी ब्रांडिंग वाली पट्टी जो हमेशा ऊपर दिखेगी */
        .custom-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #212121;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 9999;
            border-bottom: 1px solid #333;
        }
        .brand-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brand-title span { color: #ff0000; }
        
        .header-action {
            font-size: 14px;
            background: #ff0000;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* असली YouTube को ऐप के अंदर दिखाने के लिए फ्रेम */
        .youtube-frame {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- ऊपर आपका नाम और ब्रांडिंग -->
    <div class="custom-header">
        <div class="brand-title"><span>▶</span> Sanju Regar</div>
        <div class="header-action">NEW TO</div>
    </div>

    <!-- ऐप के अंदर असली YouTube मोबाइल वर्जन लोड होगा -->
    <iframe class="youtube-frame" src="https://m.youtube.com" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

</body>
</html>
