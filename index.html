<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanju Regar - NEW TO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            color: #ff0000;
            font-size: 20px;
            margin: 0;
        }
        .search-box {
            padding: 15px;
            text-align: center;
            background: #fff;
        }
        .search-box input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        .search-box button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff0000;
            color: white;
            border: 1px solid #ff0000;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }
        .content {
            padding: 20px;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sanju Regar</h1>
        <span>🎥 NEW TO</span>
    </div>

    <div class="search-box">
        <input type="text" id="query" placeholder="वीडियो खोजें...">
        <button onclick="searchVideo()">खोजें</button>
    </div>

    <div class="content">
        <h3>तैयार है आपका नया वीडियो फीड!</h3>
        <p>यहाँ आपके चैनल और ऑल इंडिया के वीडियो दिखाई देंगे।</p>
    </div>

    <script>
        function searchVideo() {
            var q = document.getElementById('query').value;
            if(q) {
                window.open('https://m.youtube.com/results?search_query=' + encodeURIComponent(q), '_blank');
            }
        }
    </script>

</body>
</html>
